# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Deploys to the `staging` deployment slot of the `webform` app.
# Two things are slot-specific and are NOT shared with the sandbox workflow:
#
#   1. the publish profile  — publishing endpoints are per slot and are not swapped,
#      so download it from the staging slot itself (slot → Get publish profile) and
#      store it as the AZUREAPPSERVICE_PUBLISHPROFILE_STAGING secret below;
#   2. the slot-name below.
#
# The App Settings that make the deployment succeed (NPM_CONFIG_INCLUDE=dev,
# NODE_ENV, DB_*, JWT_*) live on the slot, not here — see docs/plans/deploy-azure.md §5.

name: Build and deploy Node.js app to Azure Web App - webform (staging)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app-staging
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app-staging

      - name: 'Deploy to Azure Web App (staging slot)'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'webform'
          slot-name: 'staging'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_STAGING }}
