# =============================================================================
# Deploy School Forms to Azure App Service (Linux Node) on push to main.
#
# One-time setup required (GitHub repo -> Settings -> Secrets and variables
# -> Actions -> New repository secret):
#   AZURE_WEBAPP_PUBLISH_PROFILE = contents of the .PublishSettings file you
#     download from the Azure portal (webapp -> Overview -> Get publish profile).
#
# Then set the app's environment in the Azure portal (webapp -> Settings ->
# Environment variables) or via app-settings below. See docs/plans/deploy-azure.md.
#
# Startup command (Linux) must be set or the app won't boot:
#   Settings -> Configuration -> General settings -> Stack: Node 20 LTS
#   Startup command: node server/dist/index.js
# =============================================================================
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server + client
        run: npm run build

      # Package a self-contained bundle. Azure will NOT run Oryx npm install
      # (we disable build during deploy), so node_modules must ship in the zip.
      # We keep server/dist (compiled API) and client/dist (built React app).
      # Exclude source maps to keep the zip small.
      - name: Package deploy bundle
        run: |
          zip -r "${{ runner.temp }}/school-forms.zip" \
            package.json package-lock.json \
            server/dist client/dist node_modules \
            -x "*.map" "*/node_modules/.cache/*"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "webform-sandbox-addph8hsd9feghdp"
          slot-name: "production"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/school-forms.zip
          # Skip Azure's own build (we already built). Keeps deployment fast and
          # avoids Oryx tripping over the npm-workspaces monorepo.
          # These are set as app settings on the app, not passed via the action.
